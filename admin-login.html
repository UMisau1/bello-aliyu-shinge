
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinge Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101c32;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
    }
    h2 { color: #12345a; text-align: center; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 15px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087b48;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #message { text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>SHINGE ADMIN PORTAL</h2>
    <p>Sign in with your administrator account.</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
